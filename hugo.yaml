# Hugo configuration file
title: Meu Blog
enableEmoji: true
locale: "pt-BR"
defaultContentLanguage: "pt-br"
baseURL: "https://piazaopower.github.io/akitaonrails.github.io/"
defaultContentLanguageInSubdir: true

languages:
  pt-br:
    label: "Português"
    locale: "pt-BR"
    weight: 1
    menu:
      main:
        - name: Tema
          weight: 0
          params:
            type: theme-toggle
        - name: Posts
          pageRef: /posts
          weight: 1
        - name: Docs
          pageRef: /docs
          weight: 2
        - name: GitHub ↗
          url: "https://github.com/piazaopower"
          weight: 3
          params:
            icon: github
        - name: RSS
          weight: 4
          url: "/index.xml"
          params:
            icon: rss
      sidebar:
        - name: GitHub
          weight: 1
          url: "https://github.com/piazaopower/akitaonrails.github.io"
          params:
            icon: github
        - name: Posts
          weight: 2
          url: "/posts/"
          params:
            icon: file-text
        - name: Docs
          weight: 3
          url: "/docs/"
          params:
            icon: book-open
  en:
    label: "English"
    locale: "en"
    weight: 2
    title: "My Blog"
    contentDir: "content"
    params:
      description: "Personal blog with technical documentation, tutorials, and notes."
    menu:
      main:
        - name: Theme
          weight: 0
          params:
            type: theme-toggle
        - name: Posts
          pageRef: /en/posts
          weight: 1
        - name: Docs
          pageRef: /en/docs
          weight: 2
        - name: GitHub ↗
          url: "https://github.com/piazaopower"
          weight: 3
          params:
            icon: github
        - name: RSS
          weight: 4
          url: "/en/index.xml"
          params:
            icon: rss
        - name: Language
          weight: 5
          params:
            type: language-switch
      sidebar:
        - name: GitHub
          weight: 1
          url: "https://github.com/piazaopower/akitaonrails.github.io"
          params:
            icon: github
        - name: Posts
          weight: 2
          url: "/en/posts/"
          params:
            icon: file-text
        - name: Docs
          weight: 3
          url: "/en/docs/"
          params:
            icon: book-open

outputs:
  home: [HTML, RSS, SearchIndex]

outputFormats:
  SearchIndex:
    mediaType: application/json
    baseName: search-index
    isPlainText: true
    notAlternative: true

services:
  disqus:
    shortname: ""

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

params:
  # Disable Hextra's built-in FlexSearch
  search:
    enable: false

  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: true
    displayPoweredBy: true

  editURL:
    enable: true
    base: "https://github.com/piazaopower/akitaonrails.github.io/edit/main/content"

  # Keep default youtube shortcode as configurable
  youtubeDefaults:
    iframeAllowList: "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    referrerpolicy: "no-referrer"
    iframeStyle: "border:0; width:100%; aspect-ratio:16/9;"

  theme:
    default: light

  author:
    name: piazaopower
    email: ""

  description: "Blog pessoal com documentação técnica, tutoriais e anotações."
